name: Publish Release Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish or refresh, for example v1.14.40'
        required: false
        type: string
      validate_only:
        description: 'Build and validate only; do not create a release or deploy Pages'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tpw-ilungu-club-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    outputs:
      manifest_url: ${{ steps.metadata.outputs.manifest_url }}
      release_url: ${{ steps.metadata.outputs.release_url }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout requested tag when it exists
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        shell: bash
        run: |
          set -euo pipefail

          git fetch --force --tags origin

          if git rev-parse -q --verify "refs/tags/${{ inputs.tag }}" >/dev/null; then
            git checkout "${{ inputs.tag }}"
          fi

      - name: Generate Standards read token
        id: standards-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.TPW_STANDARDS_APP_ID }}
          private-key: ${{ secrets.TPW_STANDARDS_APP_PRIVATE_KEY }}
          owner: thepluginworks
          repositories: tpw-plugin-standards
          permission-contents: read

      - name: Checkout pinned TPW Standards
        uses: actions/checkout@v4
        with:
          repository: thepluginworks/tpw-plugin-standards
          ref: 15504e1b59b990f2402a984855cb789efb62c232
          path: .tpw-plugin-standards
          token: ${{ steps.standards-token.outputs.token }}
          persist-credentials: false

      - name: Resolve release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          PLUGIN_VERSION="$(grep -m1 '^ \* Version:' ilungu-club.php | sed 's/^ \* Version: *//')"
          INPUT_TAG="${{ inputs.tag }}"

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          elif [ -n "$INPUT_TAG" ]; then
            TAG_NAME="$INPUT_TAG"
          else
            TAG_NAME="v${PLUGIN_VERSION}"
          fi

          VERSION="${TAG_NAME#v}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/tpw-ilungu-club.zip"
          MANIFEST_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/tpw-ilungu-club.json"
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG_NAME}"

          echo "plugin_version=${PLUGIN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "download_url=${DOWNLOAD_URL}" >> "$GITHUB_OUTPUT"
          echo "manifest_url=${MANIFEST_URL}" >> "$GITHUB_OUTPUT"
          echo "release_url=${RELEASE_URL}" >> "$GITHUB_OUTPUT"

      - name: Validate source against TPW Standards
        shell: bash
        run: |
          set -euo pipefail

          php .tpw-plugin-standards/bin/tpw-standards validate-source \
            --require-standards-checkpoint \
            --plugin ilungu-club \
            --workspace "$GITHUB_WORKSPACE/.tpw-plugin-standards" \
            --root "$GITHUB_WORKSPACE"

      - name: Build plugin archive
        id: package
        shell: bash
        run: |
          set -euo pipefail

          ZIP_PATH="$RUNNER_TEMP/tpw-ilungu-club.zip"
          bash scripts/build-release-package.sh "$ZIP_PATH"

          echo "zip_path=${ZIP_PATH}" >> "$GITHUB_OUTPUT"

      - name: Validate archive root folder
        shell: bash
        run: |
          set -euo pipefail

          ZIP_PATH="${{ steps.package.outputs.zip_path }}"
          ARCHIVE_ENTRIES="$(mktemp)"
          trap 'rm -f "$ARCHIVE_ENTRIES"' EXIT

          unzip -Z1 "$ZIP_PATH" > "$ARCHIVE_ENTRIES"

          if [ ! -s "$ARCHIVE_ENTRIES" ]; then
            echo "Archive is empty" >&2
            exit 1
          fi

          while IFS= read -r ARCHIVE_ENTRY; do
            case "$ARCHIVE_ENTRY" in
              *'\'*|*/../*|../*|*/..|..)
                echo "Archive entry contains a path traversal: $ARCHIVE_ENTRY" >&2
                exit 1
                ;;
              tpw-ilungu-club/|tpw-ilungu-club/*)
                ;;
              *)
                echo "Archive entry is outside tpw-ilungu-club/: $ARCHIVE_ENTRY" >&2
                exit 1
                ;;
            esac
          done < "$ARCHIVE_ENTRIES"

      - name: Validate archive against TPW Standards
        shell: bash
        run: |
          set -euo pipefail

          php .tpw-plugin-standards/bin/tpw-standards validate-package \
            --plugin ilungu-club \
            --workspace "$GITHUB_WORKSPACE/.tpw-plugin-standards" \
            --root "$GITHUB_WORKSPACE" \
            --archive "${{ steps.package.outputs.zip_path }}"

          php .tpw-plugin-standards/bin/tpw-standards validate-wordpress-org \
            --plugin ilungu-club \
            --workspace "$GITHUB_WORKSPACE/.tpw-plugin-standards" \
            --root "$GITHUB_WORKSPACE" \
            --archive "${{ steps.package.outputs.zip_path }}"

      - name: Create or update GitHub release asset
        if: github.event_name != 'workflow_dispatch' || inputs.validate_only != true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG_NAME="${{ steps.metadata.outputs.tag_name }}"
          VERSION="${{ steps.metadata.outputs.version }}"
          ZIP_PATH="${{ steps.package.outputs.zip_path }}"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$ZIP_PATH#tpw-ilungu-club.zip" --clobber
          else
            gh release create "$TAG_NAME" "$ZIP_PATH#tpw-ilungu-club.zip" \
              --title "iLungu™ Club ${VERSION}" \
              --notes "Automated release for iLungu™ Club ${VERSION}." \
              --target "$GITHUB_SHA"
          fi

      - name: Generate version manifest
        if: github.event_name != 'workflow_dispatch' || inputs.validate_only != true
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          cat > dist/tpw-ilungu-club.json <<EOF
          {
            "version": "${{ steps.metadata.outputs.version }}",
            "download_url": "${{ steps.metadata.outputs.download_url }}"
          }
          EOF

          touch dist/.nojekyll

      - name: Configure GitHub Pages
        if: github.event_name != 'workflow_dispatch' || inputs.validate_only != true
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'workflow_dispatch' || inputs.validate_only != true
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    if: github.event_name != 'workflow_dispatch' || inputs.validate_only != true
    runs-on: ubuntu-latest
    needs: build-release
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4