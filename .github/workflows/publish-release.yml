name: Publish Release Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish or refresh, for example v1.14.40'
        required: false
        type: string
      validate_only:
        description: 'Build and validate only; do not create a release or deploy Pages'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: tpw-ilungu-club-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: club
    outputs:
      manifest_url: ${{ steps.metadata.outputs.manifest_url }}
      release_url: ${{ steps.metadata.outputs.release_url }}

    steps:
      - name: Validate requested release tag
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$REQUESTED_TAG" =~ ^v[0-9]+(\.[0-9]+){1,2}([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Requested tag must be a version tag beginning with v." >&2
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@11bd5960a326750d5838078e36cf38b85af677262 # v4.2.0
        with:
          fetch-depth: 0
          path: club

      - name: Checkout requested tag when it exists
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch --force --tags origin

          if git rev-parse -q --verify "refs/tags/$REQUESTED_TAG" >/dev/null; then
            git checkout --detach "refs/tags/$REQUESTED_TAG"
          fi

      - name: Resolve release metadata
        id: metadata
        env:
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          PLUGIN_VERSION="$(grep -m1 '^ \* Version:' ilungu-club.php | sed 's/^ \* Version: *//')"

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          elif [ -n "$INPUT_TAG" ]; then
            TAG_NAME="$INPUT_TAG"
          else
            TAG_NAME="v${PLUGIN_VERSION}"
          fi

          if [[ ! "$TAG_NAME" =~ ^v[0-9]+(\.[0-9]+){1,2}([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Resolved tag must be a version tag beginning with v." >&2
            exit 1
          fi

          VERSION="${TAG_NAME#v}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/tpw-ilungu-club.zip"
          MANIFEST_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/tpw-ilungu-club.json"
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG_NAME}"

          echo "plugin_version=${PLUGIN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "download_url=${DOWNLOAD_URL}" >> "$GITHUB_OUTPUT"
          echo "manifest_url=${MANIFEST_URL}" >> "$GITHUB_OUTPUT"
          echo "release_url=${RELEASE_URL}" >> "$GITHUB_OUTPUT"

      - name: Build plugin archive
        id: package
        shell: bash
        run: |
          set -euo pipefail

          ZIP_PATH="$RUNNER_TEMP/tpw-ilungu-club.zip"
          bash scripts/build-release-package.sh "$ZIP_PATH"

          echo "zip_path=${ZIP_PATH}" >> "$GITHUB_OUTPUT"

      - name: Validate archive root folder
        env:
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE_ENTRIES="$(mktemp)"
          trap 'rm -f "$ARCHIVE_ENTRIES"' EXIT

          unzip -Z1 "$ZIP_PATH" > "$ARCHIVE_ENTRIES"

          if [ ! -s "$ARCHIVE_ENTRIES" ]; then
            echo "Archive is empty" >&2
            exit 1
          fi

          while IFS= read -r ARCHIVE_ENTRY; do
            case "$ARCHIVE_ENTRY" in
              *'\'*|*/../*|../*|*/..|..)
                echo "Archive entry contains a path traversal: $ARCHIVE_ENTRY" >&2
                exit 1
                ;;
              tpw-ilungu-club/|tpw-ilungu-club/*)
                ;;
              *)
                echo "Archive entry is outside tpw-ilungu-club/: $ARCHIVE_ENTRY" >&2
                exit 1
                ;;
            esac
          done < "$ARCHIVE_ENTRIES"

      - name: Create or update GitHub release asset
        if: github.event_name != 'workflow_dispatch' || inputs.validate_only != true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.metadata.outputs.tag_name }}
          VERSION: ${{ steps.metadata.outputs.version }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$ZIP_PATH#tpw-ilungu-club.zip" --clobber
          else
            gh release create "$TAG_NAME" "$ZIP_PATH#tpw-ilungu-club.zip" \
              --title "iLungu™ Club ${VERSION}" \
              --notes "Automated release for iLungu™ Club ${VERSION}." \
              --target "$GITHUB_SHA"
          fi

      - name: Generate version manifest
        if: github.event_name != 'workflow_dispatch' || inputs.validate_only != true
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          DOWNLOAD_URL: ${{ steps.metadata.outputs.download_url }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          cat > dist/tpw-ilungu-club.json <<EOF
          {
            "version": "${VERSION}",
            "download_url": "${DOWNLOAD_URL}"
          }
          EOF

          touch dist/.nojekyll

      - name: Configure GitHub Pages
        if: github.event_name != 'workflow_dispatch' || inputs.validate_only != true
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload Pages artifact
        if: github.event_name != 'workflow_dispatch' || inputs.validate_only != true
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: club/dist

  deploy-pages:
    if: github.event_name != 'workflow_dispatch' || inputs.validate_only != true
    runs-on: ubuntu-latest
    needs: build-release
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5